name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + unit + integration tests on a real Windows runner: the audit and
  # the server auth paths only compile meaningfully with windows build tags.
  test-windows:
    name: vet + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"; echo "$out"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: coverage gate
        shell: bash
        run: |
          go test ./... -coverprofile=cover.out -count=1
          total=$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "total statement coverage: ${total}%"
          # Ratchet, not a target. Windows-only packages (collectors, regf,
          # lsass, winutil) cannot be exercised on the Linux runner, so the
          # whole-tree number stays modest; this floor exists to stop it going
          # *down*. Raise it whenever coverage improves — never lower it to
          # make a red build green.
          min=35
          if awk "BEGIN {exit !(${total} < ${min})}"; then
            echo "::error::coverage ${total}% is below the ${min}% floor"
            exit 1
          fi
      - name: build
        run: go build ./...
      - name: headless audit smoke test
        shell: pwsh
        run: |
          go build -o obliteratus.exe ./cmd/obliteratus
          ./obliteratus.exe --audit --json > audit.json
          $code = $LASTEXITCODE
          # Exit 1 is the documented contract for "a CRITICAL/HIGH control is
          # failing" — always true on a stock CI runner (Defender off, etc).
          # Only 2+ means the binary crashed.
          if ($code -ge 2) { Write-Error "audit crashed (exit $code)"; exit $code }
          Write-Host "audit exit code: $code (1 = failing CRITICAL/HIGH control, expected on CI)"
          $json = Get-Content audit.json -Raw | ConvertFrom-Json
          $count = @($json.findings).Count
          Write-Host "findings: $count"
          if ($count -lt 1) { Write-Error "audit produced no findings"; exit 1 }
          # Explicit exit: the runner's pwsh wrapper appends
          # `if (Test-Path variable:\LASTEXITCODE) { exit $LASTEXITCODE }`,
          # so the audit's own exit 1 would otherwise fail the step even
          # after every assertion above passed.
          exit 0

  # Cross-compile from Linux: catches build-tag drift that would break
  # contributors on macOS/Linux running `go test ./...` with the stubs.
  cross-compile:
    name: cross-compile (linux → windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build all packages for windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./...
      - name: unit tests (platform-neutral packages)
        run: go test ./internal/token ./internal/audit ./internal/ui ./internal/server

  # Reachability-aware vulnerability scanning: govulncheck reports only the
  # advisories your code can actually reach, so its verdict is actionable
  # rather than a noisy list of every CVE in the module graph. It exits
  # non-zero on a finding, which is what gates the merge.
  #
  # The Go *toolchain* matters here as much as the dependencies: the standard
  # library ships in the binary, so an old toolchain is a vulnerable
  # dependency. go.mod pins a patched floor and this job reads it.
  security:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck ./...
        run: govulncheck ./...
